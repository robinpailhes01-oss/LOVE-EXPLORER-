<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kia — Assistante Love Explorer</title>
  <meta name="description" content="Kia, l'assistante Love Explorer : elle vous qualifie en quelques questions et vous guide vers le logement romantique parfait." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E💗%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="backdrop-glow"></div>

  <main class="kia-panel" id="kia-panel">
    <header class="kia-header">
      <div class="kia-avatar">K</div>
      <div class="kia-identity">
        <strong>Kia <span class="brand-mark">❦</span></strong>
        <span class="kia-status">
          <span class="dot"></span> Assistante Love Explorer
          <span class="kia-mode" id="kia-mode" title="Mode de conversation"></span>
        </span>
      </div>
      <button class="kia-restart" id="kia-restart" title="Recommencer la conversation">↺</button>
    </header>

    <div class="kia-messages" id="kia-messages"></div>
    <div class="kia-quick" id="kia-quick"></div>

    <form class="kia-input" id="kia-form">
      <input type="text" id="kia-text" placeholder="Écrivez à Kia…" autocomplete="off" />
      <button type="submit" aria-label="Envoyer">➤</button>
    </form>
  </main>

  <script src="js/data.js"></script>
  <script src="js/kia.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
